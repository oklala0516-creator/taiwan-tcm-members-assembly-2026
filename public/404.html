<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F3E9" />
    <title>找不到頁面｜台灣中藥權益促進會</title>
    <style>
      :root { color: #1f2d26; background: #f7f3e9; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; box-sizing: border-box; }
      main { width: min(100%, 560px); padding: 40px 28px; text-align: center; background: #fffdf8; border: 1px solid #dce7dd; border-radius: 26px; box-shadow: 0 24px 60px rgba(31,45,38,.08); }
      h1 { margin: 0 0 14px; font-family: "Noto Serif TC", "Songti TC", serif; font-size: clamp(2rem, 9vw, 3.8rem); }
      p { color: #667068; line-height: 1.8; }
      a { display: inline-flex; min-height: 48px; margin-top: 12px; padding: 0 22px; align-items: center; color: #1f2d26; background: #f1d568; border-radius: 999px; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>這一頁暫時找不到</h1>
      <p>可能是網址已變更，請回到活動首頁繼續查看行程與活動資訊。</p>
      <a id="home-link" href="/">返回活動首頁</a>
    </main>
    <script>
      const path = location.pathname.split('/').filter(Boolean);
      const isGitHubPages = location.hostname.endsWith('.github.io');
      document.getElementById('home-link').href = isGitHubPages && path.length ? `/${path[0]}/` : '/';
    </script>
  </body>
</html>
